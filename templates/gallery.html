<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crimson Gallery</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>CRIMSON SHOP</h1>

        <nav>
            <a href="/">HOME</a>
            <a href="/shop">SHOP</a>
            <a href="/gallery">GALLERY</a>
            <a href="/contact">CONTACT</a>
        </nav>
    </header>


    <main class="gallery">

        <h2>GALLERY</h2>

        <p class="shop-intro">
            Enter the darkness and explore my collection.
        </p>


        <!-- AUTOMATIC IMAGE GALLERY -->

        <div class="gallery-grid">

            {% for image in images %}

            <div class="gallery-item">

                <img
                    src="{{ url_for('static', filename='images/' + image) }}"
                    alt="{{ image }}"
                    draggable="false"
                >

            </div>

            {% else %}

            <p class="no-images">
                No artwork has been added yet.
            </p>

            {% endfor %}

        </div>

    </main>


    <footer>

        <p>© 2026 Crimson Shop</p>

    </footer>


    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
